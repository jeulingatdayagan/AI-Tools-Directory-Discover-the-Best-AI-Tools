<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | AI Tools Directory</title>

<meta name="description"
content="The page you are looking for does not exist. Return to AI Tools Directory and discover useful AI tools.">

<link rel="stylesheet" href="style.css">

<link rel="icon" href="icons/icon-192.png">

<style>

.error-box{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

}


.error-content{

background:rgba(30,41,59,.9);

padding:45px;

border-radius:20px;

max-width:500px;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}


.error-content h1{

font-size:90px;

color:#38bdf8;

margin-bottom:10px;

}


.error-content h2{

margin-bottom:15px;

}


.error-content p{

color:#94a3b8;

margin-bottom:25px;

}


.home-btn{

display:inline-block;

background:linear-gradient(
90deg,
#2563eb,
#38bdf8
);

color:white;

padding:14px 30px;

border-radius:30px;

text-decoration:none;

transition:.3s;

}


.home-btn:hover{

transform:scale(1.05);

}

</style>

</head>


<body>


<div class="error-box">


<div class="error-content">


<h1>404</h1>


<h2>Oops! Page Not Found</h2>

The AI tool page you are looking for may have been removed,

<a class="home-btn" href="./">
